name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      Jwt__Key: ci-only-test-key-not-a-secret-0123456789abcdef
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore server/SmartEstimatePlatform.slnx
      - name: Build
        run: dotnet build server/SmartEstimatePlatform.slnx --configuration Release --no-restore
      - name: Test
        run: dotnet test server/SmartEstimatePlatform.slnx --configuration Release --no-build
      - name: Vulnerable packages
        run: |
          dotnet list server/SmartEstimatePlatform.slnx package --vulnerable --include-transitive | tee vulnerable.txt
          ! grep -q "has the following vulnerable packages" vulnerable.txt

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=moderate

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: server
          push: false
          build-args: APP_VERSION=ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: client
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

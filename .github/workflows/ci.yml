name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      Jwt__Key: ci-only-test-key-not-a-secret-0123456789abcdef
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet build server/SmartEstimatePlatform.slnx --configuration Release
      - run: dotnet test server/SmartEstimatePlatform.slnx --configuration Release --no-build
      - name: Vulnerable packages
        run: |
          dotnet list server/SmartEstimatePlatform.slnx package --vulnerable --include-transitive | tee vulnerable.txt
          ! grep -q "has the following vulnerable packages" vulnerable.txt

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run test
      - run: npm audit --omit=dev --audit-level=moderate